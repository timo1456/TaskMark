{% extends 'base.html' %}{% block title %}Notifications · TaskMark{% endblock %}{% block content %}<div class="page-head"><div><span class="eyebrow">INBOX</span><h1>Notifications</h1></div></div><div class="list">{% for n in notifications %}<a class="list-row" href="{{ n.link }}"><div><strong>{{ n.title }}</strong><span>{{ n.message }}</span></div><small>{{ n.created_at.strftime('%d %b %H:%M') }}</small></a>{% else %}<div class="empty">You're all caught up.</div>{% endfor %}</div>{% endblock %}
