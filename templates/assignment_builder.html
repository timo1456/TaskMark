{% extends 'base.html' %}{% block title %}Build assignment · TaskMark{% endblock %}{% block content %}<div class="page-head"><div><span class="eyebrow">{{ course.class_group.name }} · {{ course.name }}</span><h1>Build assignment</h1><p class="muted">Mix MCQ, theory and file questions. Drafts stay private.</p></div></div><form method="post" enctype="multipart/form-data" id="builder" class="stack"><section class="card form-card stack"><label>Assignment title<input name="title" value="{{ builder_state.title|default('') }}" required></label><label>General instructions<textarea name="instructions" rows="5" required>{{ builder_state.instructions|default('') }}</textarea></label><div class="two"><label>Start time<input id="start-at" name="start_at" type="datetime-local" value="{{ builder_state.start_at|default('') }}" required><small><label class="toggle"><input id="launch-now" name="launch_now" type="checkbox" {% if builder_state.launch_now %}checked{% endif %}> Launch immediately</label></small></label><label>Deadline<input name="deadline" type="datetime-local" value="{{ builder_state.deadline|default('') }}" required></label></div><label class="toggle"><input type="checkbox" name="allow_edit" {% if builder_state.allow_edit %}checked{% endif %}> Allow students to edit after submission</label></section><section class="card"><div class="section-head"><h2>Questions</h2></div><div id="questions"></div><div class="actions"><button type="button" class="btn soft" id="add-question">＋ Add question</button></div></section><div class="actions end"><button class="btn ghost" name="action" value="draft">Save draft</button><button class="btn primary" name="action" value="publish">Publish assignment</button></div></form><template id="question-template"><div class="question-builder"><div class="q-head"><b class="q-number">Question</b><button type="button" class="link danger remove-question">Remove</button></div><div class="two"><label>Type<select class="q-type"><option value="mcq">Multiple choice</option><option value="theory">Theory</option><option value="file">File question</option></select></label><label>Marks<input class="q-marks" type="number" min=".5" step=".5" value="5"></label></div><label>Question / instructions<textarea class="q-prompt" rows="3" required></textarea></label><div class="mcq-fields"><label>Options</label><div class="options"></div><button type="button" class="link add-option">＋ Add option</button></div><div class="file-fields"><label>Supporting material<input class="q-file" type="file"></label></div></div></template><script id="builder-state" type="application/json">{{ builder_state.questions|default([])|tojson }}</script>{% endblock %}
